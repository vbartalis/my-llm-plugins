# tmux.conf — loaded by .devcontainer/dev-session.sh when it spawns the tmux server.
#
# Deliberately small. Prefix stays the default Ctrl-b; nothing here remaps keys,
# so muscle memory from any other tmux still works.

# Mouse stays OFF on purpose. With mouse on, tmux captures drag-select and the
# browser/VS Code terminal can no longer do a native text selection — which is
# the same reason horizontal splits are avoided. Scroll back with Ctrl-b [ instead.
set -g mouse off

# Default 2000 lines loses a stack trace fast.
set -g history-limit 50000

# Without this, tmux swallows the Esc prefix for ~500ms and Claude Code / vim
# key sequences feel broken.
set -sg escape-time 0

# True colour + italics inside the container. `ncurses-term` (installed by
# post-create.sh) provides the tmux-256color entry.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g status-left "#[bold] #S #[default]"
set -g status-right " %H:%M "
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[reverse] #I:#W #[default]"

# Renumber after closing a window so indices stay 0..N with no gaps.
set -g renumber-windows on

# Focus events let Claude Code and editors notice they've been switched away from.
set -g focus-events on
